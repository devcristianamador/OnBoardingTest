<p-dialog [(visible)]="visible" [header]="dialogTitle" [modal]="true" [style]="{ width: '450px' }">
  <form [formGroup]="form">
    <div class="field mb-4">
      <label for="name" class="block mb-1 font-medium">Name</label>
      <input id="name" pInputText formControlName="name" class="w-full"
        [class.ng-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
        [class.ng-dirty]="form.get('name')?.touched" />
      <small class="p-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
        Name is required.
      </small>
    </div>

    <div class="field mb-4">
      <label for="address" class="block mb-1 font-medium">Address</label>
      <input id="address" pInputText formControlName="address" class="w-full"
        [class.ng-invalid]="form.get('address')?.invalid && form.get('address')?.touched"
        [class.ng-dirty]="form.get('address')?.touched" />
      <small class="p-error" *ngIf="form.get('address')?.invalid && form.get('address')?.touched">
        Address is required.
      </small>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="onCancel()"></button>
    <button pButton label="Save" icon="pi pi-check" (click)="onSave()"></button>
  </ng-template>
</p-dialog>
